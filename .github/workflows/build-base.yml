name: Build Android Base Images

on:
  push:
    branches: [main]
    paths:
      - 'gapps/**'
      - 'arm-trans/**'
      - 'androiddistro/**'
      - 'scripts/lib/inject-gapps.sh'
      - 'scripts/lib/inject-arm-trans.sh'
      - '.github/workflows/build-base.yml'
  schedule:
    # Rebuild monthly to pick up updated GApps packages
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      build_bliss14:
        description: 'Build BlissOS 14 (blissos14-gapps-arm.qcow2)'
        type: boolean
        default: true
      build_sakura:
        description: 'Build Project Sakura FOSS (sakura-foss.qcow2)'
        type: boolean
        default: true
      build_bliss15:
        description: 'Build BlissOS 15 FOSS (blissos15-foss-arm.qcow2)'
        type: boolean
        default: true
      force_rebuild:
        description: 'Force full rebuild even if cache is valid'
        type: boolean
        default: false
      source_img_url:
        description: 'Override source ISO URL for the selected distro (leave blank to auto-resolve)'
        type: string
        default: ''
      gapps_url:
        description: 'Override GApps URL for all distros (leave blank to use per-distro default from androiddistro/*.json)'
        type: string
        default: ''
      run_smoke_test:
        description: 'Run full VM boot smoke test — bliss14 only (requires self-hosted KVM runner)'
        type: boolean
        default: false

# Only one build runs at a time — later runs cancel earlier queued ones
concurrency:
  group: build-base
  cancel-in-progress: true

permissions:
  contents: write   # required to create GitHub releases and upload assets

env:
  GAPPS_SHA256: ""
  ARM_TRANS_COMMIT: "9324a8914b649b885dad6f2bfd14a67e5d1520bf"
  # Increment BUILD_VERSION whenever build logic changes to invalidate all caches.
  BUILD_VERSION: "8"

jobs:
  # ─── Job 1: compute distro matrix ────────────────────────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build distro matrix
        id: matrix
        run: |
          # On push/schedule build all distros; on workflow_dispatch respect the checkboxes
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            do_bliss14="${{ inputs.build_bliss14 }}"
            do_sakura="${{ inputs.build_sakura }}"
            do_bliss15="${{ inputs.build_bliss15 }}"
          else
            do_bliss14="true"
            do_sakura="true"
            do_bliss15="true"
          fi

          includes='[]'

          add_distro() {
            local slug="$1"
            local cfg="androiddistro/${slug}.json"
            local base_image inject_gapps source_url source_filename cache_key source_type gapps_url

            base_image=$(  jq -r '.base_image'            "$cfg")
            inject_gapps=$(    jq -r 'if .inject_gapps     == true then "true" else "false" end' "$cfg")
            inject_arm_trans=$(jq -r 'if .inject_arm_trans == true then "true" else "false" end' "$cfg")
            source_type=$(     jq -r '.source.type'           "$cfg")
            source_url=$(  jq -r '.source.url      // ""' "$cfg")
            source_filename=$(jq -r '.source.filename // ""' "$cfg")

            # GApps URL: per-distro default from JSON, overridable via workflow_dispatch input
            gapps_url=$(jq -r '.gapps.url // ""' "$cfg")
            [ -n "${{ inputs.gapps_url }}" ] && gapps_url="${{ inputs.gapps_url }}"

            # BlissOS: resolve latest ISO filename from SourceForge for stable cache key
            if [ "$source_type" = "sourceforge_latest" ]; then
              sf_path=$(jq -r '.source.sf_path'   "$cfg")
              sf_filter=$(jq -r '.source.sf_filter' "$cfg")
              resolver_out=$(python3 scripts/lib/resolve-blissos-url.py \
                --path "$sf_path" --filter "$sf_filter" 2>/dev/null)
              source_url=$(     echo "$resolver_out" | grep '^url='      | cut -d= -f2-)
              source_filename=$(echo "$resolver_out" | grep '^filename=' | cut -d= -f2-)
            fi

            cache_key="base-image-${slug}-$(printf '%s' \
              "${slug} ${source_filename} ${{ env.ARM_TRANS_COMMIT }} ${{ env.BUILD_VERSION }}" \
              | sha256sum | awk '{print $1}' | cut -c1-16)"

            entry=$(jq -n \
              --arg distro          "$slug" \
              --arg base_image      "$base_image" \
              --arg inject_gapps    "$inject_gapps" \
              --arg cache_key       "$cache_key" \
              --arg source_url      "$source_url" \
              --arg source_filename "$source_filename" \
              --arg gapps_url       "$gapps_url" \
              --arg inject_arm_trans "$inject_arm_trans" \
              '{distro:$distro, base_image:$base_image, inject_gapps:$inject_gapps,
                inject_arm_trans:$inject_arm_trans,
                cache_key:$cache_key, source_url:$source_url, source_filename:$source_filename,
                gapps_url:$gapps_url}')
            includes=$(echo "$includes" | jq ". + [$entry]")
          }

          [ "$do_bliss14" = "true" ] && add_distro bliss14
          [ "$do_sakura"  = "true" ] && add_distro sakura
          [ "$do_bliss15" = "true" ] && add_distro bliss15

          matrix=$(echo "$includes" | jq -c '{include: .}')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo "Distro matrix:"
          echo "$matrix" | jq .

      - name: Validate distro configs
        run: |
          for f in androiddistro/*.json; do
            echo "Validating $f ..."
            jq empty "$f" || { echo "::error::Invalid JSON: $f"; exit 1; }
          done

      - name: Validate device profile schemas
        run: |
          pip3 install jsonschema --quiet
          for f in profiles/*.json; do
            [ "$(basename "$f")" = "schema.json" ] && continue
            echo "Validating $f"
            python3 scripts/lib/profile-validator.py "$f"
          done

      - name: Run validation consistency tests
        run: bash tests/run-validation-tests.sh

  # ─── Job 2: build (one run per distro via matrix) ─────────────────────────
  #
  # Runs on standard GitHub-hosted ubuntu-22.04 runners. KVM is NOT required
  # here — the image is built via offline NBD mount + file injection, which is
  # pure userspace. If /dev/kvm happens to be present the step logs it, but
  # the build never tries to boot the VM.
  build:
    name: Build ${{ matrix.distro }}
    needs: preflight
    if: needs.preflight.outputs.matrix != '{"include":[]}'
    strategy:
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # ── Cache lookup ────────────────────────────────────────────────────────
      - name: Check cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ matrix.cache_key }}
          lookup-only: true

      - name: Determine build needed
        id: plan
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] \
             && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "build=false" >> $GITHUB_OUTPUT
            echo "::notice::Cache hit for ${{ matrix.distro }} — skipping build, will re-publish release"
          else
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Building ${{ matrix.distro }} from scratch"
          fi

      # ── Build path ─────────────────────────────────────────────────────────
      - name: Install build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils \
            android-tools-adb simg2img \
            e2fsprogs python3 python3-pip jq curl rsync \
            p7zip-full lzip unzip squashfs-tools dosfstools \
            parted
          pip3 install jsonschema --quiet

      - name: Detect execution environment
        if: steps.plan.outputs.build == 'true'
        run: |
          [ -e /dev/kvm ] \
            && echo "KVM available — hardware acceleration present" \
            || echo "::notice::KVM not available — build uses offline NBD mount only, this is fine"

      # ── Source ISO ──────────────────────────────────────────────────────────
      - name: Cache source ISO
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@v4
        id: source-cache
        with:
          path: source-image/
          key: source-img-${{ matrix.source_filename }}

      - name: Download source ISO
        if: steps.plan.outputs.build == 'true' && steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p source-image
          url="${{ matrix.source_url }}"
          [ -n "${{ inputs.source_img_url }}" ] && url="${{ inputs.source_img_url }}"
          echo "Downloading: $url"
          curl -L --retry 5 --retry-delay 10 --retry-max-time 300 \
            "$url" -o source-image/source.img
          file source-image/source.img
          file source-image/source.img | grep -qi "ISO 9660\|CD-ROM" \
            || { echo "::error::Downloaded file is not an ISO — URL may have returned HTML. URL: ${url}"; exit 1; }

      # ── GApps (BlissOS 14 only — Sakura is FOSS) ───────────────────────────
      - name: Cache GApps
        if: steps.plan.outputs.build == 'true' && matrix.inject_gapps == 'true'
        uses: actions/cache@v4
        id: gapps-cache
        with:
          path: gapps/
          key: gapps-${{ matrix.gapps_url }}

      - name: Download GApps
        if: steps.plan.outputs.build == 'true' && matrix.inject_gapps == 'true' && steps.gapps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p gapps
          curl -L --retry 5 --retry-delay 10 \
            "${{ matrix.gapps_url }}" \
            -o gapps/gapps.zip
          if [ -n "${{ env.GAPPS_SHA256 }}" ]; then
            echo "${{ env.GAPPS_SHA256 }}  gapps/gapps.zip" | sha256sum -c
          fi
          file gapps/gapps.zip
          file gapps/gapps.zip | grep -qi "Zip archive\|zip\|Java archive" \
            || { echo "::error::Downloaded GApps file is not a zip"; exit 1; }

      # ── ARM translation ────────────────────────────────────────────────────
      - name: Cache ARM translation
        if: steps.plan.outputs.build == 'true' && matrix.inject_arm_trans == 'true'
        uses: actions/cache@v4
        id: armtrans-cache
        with:
          path: arm-trans/
          key: arm-trans-${{ env.ARM_TRANS_COMMIT }}

      - name: Download ARM translation
        if: steps.plan.outputs.build == 'true' && matrix.inject_arm_trans == 'true' && steps.armtrans-cache.outputs.cache-hit != 'true'
        run: bash scripts/lib/fetch-arm-trans.sh arm-trans/

      # ── Extract files from ISO ───────────────────────────────────────────────
      # Uses 7z — no loop-mount/sudo needed.
      # system.sfs is kept intact; init loop-mounts it at boot (do_install path).
      - name: Extract files from ISO
        if: steps.plan.outputs.build == 'true'
        run: |
          EXTRACT="work/iso-extract"
          mkdir -p "$EXTRACT"
          7z x -y -bb0 -o"$EXTRACT" source-image/source.img \
              kernel initrd.img ramdisk.img \
              system.sfs system.img \
              vendor.sfs vendor.img \
              product.sfs product.img \
              '*.cfg' -r >/dev/null 2>&1 || true
          # Flatten any nested files to extract root
          find "$EXTRACT" -mindepth 2 -type f \( \
              -name kernel -o -name initrd.img -o -name ramdisk.img \
              -o -name 'system.*' -o -name 'vendor.*' -o -name 'product.*' \) \
            -exec mv -n {} "$EXTRACT/" \;
          # Consolidate cfg files under _cfg/
          mkdir -p "$EXTRACT/_cfg"
          find "$EXTRACT" -maxdepth 1 -type f -name '*.cfg' -exec mv -n {} "$EXTRACT/_cfg/" \;
          find "$EXTRACT" -mindepth 2 -type f -name '*.cfg' -exec mv -n {} "$EXTRACT/_cfg/" \;
          find "$EXTRACT" -mindepth 1 -type d -empty -delete
          echo "=== ISO extract contents ==="
          ls -lh "$EXTRACT/"
          ls -lh "$EXTRACT/_cfg/" 2>/dev/null || true
          [ -f "$EXTRACT/kernel" ] \
            || { echo "::error::kernel not found in ISO"; exit 1; }
          { [ -f "$EXTRACT/initrd.img" ] || [ -f "$EXTRACT/ramdisk.img" ]; } \
            || { echo "::error::initrd.img/ramdisk.img not found in ISO"; exit 1; }
          { [ -f "$EXTRACT/system.sfs" ] || [ -f "$EXTRACT/system.img" ]; } \
            || { echo "::error::No system.sfs or system.img found in ISO"; exit 1; }
          echo "Extraction complete."

      - name: Inject ARM translation into vendor
        if: steps.plan.outputs.build == 'true' && matrix.inject_arm_trans == 'true'
        run: |
          EXTRACT="work/iso-extract"
          mkdir -p work/mnt/vendor
          if [ -f "$EXTRACT/vendor.sfs" ]; then
            echo "Unsquashing vendor.sfs..."
            sudo unsquashfs -d work/vendor-sq "$EXTRACT/vendor.sfs"
            for inner in work/vendor-sq/vendor.img work/vendor-sq/system.img; do
              [ -f "$inner" ] && { cp "$inner" work/vendor.img; break; }
            done
            sudo rm -rf work/vendor-sq
          elif [ -f "$EXTRACT/vendor.img" ]; then
            cp "$EXTRACT/vendor.img" work/vendor.img
          fi
          [ -f work/vendor.img ] \
            || { echo "::error::No vendor.sfs or vendor.img in ISO"; exit 1; }
          # Convert sparse image if needed
          file work/vendor.img | grep -qi "Android sparse" \
            && { simg2img work/vendor.img work/vendor.raw && mv work/vendor.raw work/vendor.img; } || true
          sudo mount -o loop,rw work/vendor.img work/mnt/vendor
          sudo bash scripts/lib/inject-arm-trans.sh arm-trans/libndk_translation work/mnt/vendor
          # Write ARM bridge props
          VPROP="work/mnt/vendor/build.prop"
          sudo touch "$VPROP"
          for kv in \
            "ro.product.cpu.abilist=x86_64,x86,arm64-v8a,armeabi-v7a,armeabi" \
            "ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi" \
            "ro.product.cpu.abilist64=x86_64,arm64-v8a" \
            "ro.dalvik.vm.native.bridge=libndk_translation.so" \
            "ro.enable.native.bridge.exec=1" \
            "ro.vendor.enable.native.bridge.exec=1" \
            "ro.vendor.enable.native.bridge.exec64=1" \
            "ro.ndk_translation.version=0.2.2"
          do
            key="${kv%%=*}"
            sudo grep -q "^${key}=" "$VPROP" 2>/dev/null \
              && sudo sed -i "s|^${key}=.*|${kv}|" "$VPROP" \
              || echo "$kv" | sudo tee -a "$VPROP" >/dev/null
          done
          echo "=== ARM bridge props written ==="
          sudo grep "ro\.dalvik\|ro\.enable\.native\|abilist" "$VPROP" || true
          sudo umount work/mnt/vendor
          sudo rmdir work/mnt/vendor

      # ── Assemble bootable disk image ─────────────────────────────────────────
      # GPT: p1=ext4 BlissOS (android/ subdir with system.sfs intact),
      #      p2=ext4 Userdata (8 GiB).
      # Mirrors the do_install layout: init loop-mounts android/system.sfs at boot.
      - name: Assemble bootable disk image
        if: steps.plan.outputs.build == 'true'
        run: |
          EXTRACT="work/iso-extract"
          # Stage into android/ subdir (mirrors do_install)
          mkdir -p work/stage/android
          cp "$EXTRACT/kernel" work/stage/android/kernel
          if [ -f "$EXTRACT/initrd.img" ]; then
            cp "$EXTRACT/initrd.img" work/stage/android/initrd.img
          else
            cp "$EXTRACT/ramdisk.img" work/stage/android/initrd.img
          fi
          # system.sfs kept intact (init loop-mounts it); system.img as fallback
          if   [ -f "$EXTRACT/system.sfs" ]; then cp "$EXTRACT/system.sfs" work/stage/android/system.sfs
          elif [ -f "$EXTRACT/system.img" ]; then cp "$EXTRACT/system.img" work/stage/android/system.img
          fi
          # vendor: ARM-injected raw img > sfs > img from ISO
          if   [ -f work/vendor.img           ]; then cp work/vendor.img           work/stage/android/vendor.img
          elif [ -f "$EXTRACT/vendor.sfs"     ]; then cp "$EXTRACT/vendor.sfs"     work/stage/android/vendor.sfs
          elif [ -f "$EXTRACT/vendor.img"     ]; then cp "$EXTRACT/vendor.img"     work/stage/android/vendor.img
          fi
          # product
          if   [ -f "$EXTRACT/product.sfs" ]; then cp "$EXTRACT/product.sfs" work/stage/android/product.sfs
          elif [ -f "$EXTRACT/product.img" ]; then cp "$EXTRACT/product.img" work/stage/android/product.img
          fi
          echo "=== Stage contents ==="
          ls -lh work/stage/android/

          # Size: stage content × 1.2 + 256 MiB pad + 8 GiB userdata
          STAGE_BYTES=$(du -sb work/stage/android | awk '{print $1}')
          DATA_MIB=$(( (STAGE_BYTES / 1024 / 1024) * 12 / 10 + 256 ))
          USERDATA_MIB=8192
          DATA_END_MIB=$(( 1 + DATA_MIB ))
          DISK_MIB=$(( DATA_END_MIB + USERDATA_MIB + 4 ))
          echo "Disk: ${DISK_MIB} MiB  (data ${DATA_MIB} MiB + ${USERDATA_MIB} MiB userdata)"

          truncate -s "${DISK_MIB}M" work/disk.raw
          sudo parted -s work/disk.raw mklabel gpt \
            mkpart Data     ext4 1MiB           "${DATA_END_MIB}MiB" \
            mkpart Userdata ext4 "${DATA_END_MIB}MiB" 100%

          LOOP=$(sudo losetup --find --show --partscan work/disk.raw)
          echo "Loop device: $LOOP"
          sleep 1
          sudo mkfs.ext4 -L BlissOS  "${LOOP}p1"
          sudo mkfs.ext4 -L Userdata "${LOOP}p2"
          sudo mkdir -p work/mnt/android
          sudo mount "${LOOP}p1" work/mnt/android
          sudo cp -a work/stage/android work/mnt/android/
          sudo umount work/mnt/android
          sudo rmdir  work/mnt/android
          sudo losetup -d "$LOOP"

      - name: Convert disk image to qcow2
        if: steps.plan.outputs.build == 'true'
        run: |
          mkdir -p image-cache
          qemu-img convert -O qcow2 -c \
            work/disk.raw \
            "image-cache/${{ matrix.base_image }}"
          qemu-img info "image-cache/${{ matrix.base_image }}"

      - name: Extract boot sidecars
        if: steps.plan.outputs.build == 'true'
        run: |
          BASE_NAME="${{ matrix.base_image }}"
          BASE_NAME="${BASE_NAME%.qcow2}"
          EXTRACT="work/iso-extract"

          cp "$EXTRACT/kernel" "image-cache/${BASE_NAME}-kernel"
          if [ -f "$EXTRACT/initrd.img" ]; then
            cp "$EXTRACT/initrd.img" "image-cache/${BASE_NAME}-initrd.img"
          else
            cp "$EXTRACT/ramdisk.img" "image-cache/${BASE_NAME}-initrd.img"
          fi

          # Awk-based GRUB menuentry parser (handles EFI grub.cfg / android.cfg)
          _linux_line=""
          for _cfg in "$EXTRACT/_cfg/android.cfg" "$EXTRACT/_cfg/grub.cfg" \
                      "$EXTRACT/_cfg"/*.cfg; do
            [ -f "$_cfg" ] || continue
            _line=$(awk '
              /^[[:space:]]*menuentry/ { in_entry=1; next }
              in_entry && /^[[:space:]]*linux[[:space:]]/ {
                sub(/^[[:space:]]*linux[[:space:]]+[^[:space:]]+[[:space:]]*/,""); print; exit
              }' "$_cfg" 2>/dev/null || true)
            [ -n "$_line" ] && { _linux_line="$_line"; break; }
          done
          # ISOLINUX fallback (BlissOS 14 / Android-x86 ISOs)
          if [ -z "$_linux_line" ]; then
            for _icfg in "$EXTRACT/_cfg/isolinux.cfg" "$EXTRACT/_cfg/android.cfg" \
                         "$EXTRACT/_cfg/default.cfg" "$EXTRACT/_cfg"/*.cfg; do
              [ -f "$_icfg" ] || continue
              _al=$(grep -m1 -iE '^\s*APPEND\s' "$_icfg" 2>/dev/null || true)
              [ -n "$_al" ] && {
                _linux_line="linux /kernel $(echo "$_al" | sed -E 's/^\s*APPEND\s+//')"
                break
              }
            done
          fi

          if [ -n "$_linux_line" ]; then
            _base=$(echo "$_linux_line" \
              | sed -E 's/^\s*linux\s+\S+\s*//' \
              | tr ' ' '\n' \
              | grep -vE '^(root=|SRC=|DATA=|BOOT_IMAGE=|iso-scan|console=|quiet$|nomodeset$|androidboot\.enable_console=|HWC=|GRALLOC=)' \
              | grep -v '^$' | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          else
            echo "::warning::No linux/APPEND line found in ISO config — using fallback cmdline"
            _base="androidboot.hardware=android_x86_64 androidboot.selinux=permissive"
          fi

          printf '%s SRC=android HWC=swiftshader\n' "$_base" \
            | sed 's/[[:space:]]\+/ /g; s/ *$//' \
            > "image-cache/${BASE_NAME}-cmdline"
          echo "Cmdline: $(cat "image-cache/${BASE_NAME}-cmdline")"
          echo "=== Boot sidecars ==="
          ls -lh "image-cache/${BASE_NAME}-"*

      - name: Derive base name
        id: base
        run: |
          img="${{ matrix.base_image }}"
          echo "name=${img%.qcow2}" >> "$GITHUB_OUTPUT"

      - name: Record checksum
        if: steps.plan.outputs.build == 'true'
        run: |
          cd image-cache
          sha256sum "${{ matrix.base_image }}" > "${{ matrix.base_image }}.sha256"
          cat "${{ matrix.base_image }}.sha256"

      - name: Save image to cache
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: image-cache/
          key: ${{ matrix.cache_key }}

      # ── Cache-hit path: restore without rebuilding ─────────────────────────
      - name: Restore from cache (hit)
        if: steps.plan.outputs.build == 'false'
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ matrix.cache_key }}

      # ── Release upload (always, build or cache) ────────────────────────────
      - name: Split large image for release upload
        id: split
        run: |
          if [ ! -f "image-cache/${{ matrix.base_image }}" ]; then
            echo "::error::image-cache/${{ matrix.base_image }} not found — build or cache restore failed"
            ls -lh image-cache/ 2>/dev/null || echo "(image-cache/ missing)"
            exit 1
          fi
          SIZE=$(stat -c%s "image-cache/${{ matrix.base_image }}")
          echo "Image size: $(( SIZE / 1024 / 1024 )) MB"
          if [ "$SIZE" -gt 1990000000 ]; then
            echo "Splitting into 1.9 GB parts..."
            split -b 1900M \
              "image-cache/${{ matrix.base_image }}" \
              "image-cache/${{ matrix.base_image }}.part-"
            rm "image-cache/${{ matrix.base_image }}"
            ls -lh "image-cache/${{ matrix.base_image }}.part-"*
            echo "split=true" >> $GITHUB_OUTPUT
          else
            echo "split=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release tag
        id: tag
        run: echo "tag=${{ matrix.distro }}-base-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ matrix.distro }} base image ${{ steps.tag.outputs.tag }}"
          body: |
            Intermediate base image for **${{ matrix.distro }}**.

            | Field | Value |
            |---|---|
            | Distro | `${{ matrix.distro }}` |
            | Output | `${{ matrix.base_image }}` |
            | ARM translation | ${{ matrix.inject_arm_trans == 'true' && format('commit `{0}`', env.ARM_TRANS_COMMIT) || 'none' }} |
            | GApps | ${{ matrix.inject_gapps == 'true' && matrix.gapps_url || 'none' }} |
            | Source | `${{ matrix.source_filename }}` |

            **Verify before use:**
            ```
            sha256sum -c ${{ matrix.base_image }}.sha256
            ```

            If split (`.part-aa`, `.part-ab` …), reassemble first:
            ```
            cat ${{ matrix.base_image }}.part-* > ${{ matrix.base_image }}
            ```
          files: |
            image-cache/${{ matrix.base_image }}*
            image-cache/${{ steps.base.outputs.name }}-kernel
            image-cache/${{ steps.base.outputs.name }}-initrd.img
            image-cache/${{ steps.base.outputs.name }}-cmdline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 3: static artifact validation ───────────────────────────────────
  validate-artifact:
    name: Validate ${{ matrix.distro }}
    needs: [preflight, build]
    if: always() && needs.build.result == 'success'
    strategy:
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils python3 jq
          pip3 install jsonschema --quiet

      - name: Restore image from cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ matrix.cache_key }}

      - name: Verify image integrity
        run: |
          echo "=== image-cache contents ==="
          ls -lh image-cache/
          echo "=== qemu-img check ==="
          qemu-img check "image-cache/${{ matrix.base_image }}"
          echo "=== Image info ==="
          qemu-img info  "image-cache/${{ matrix.base_image }}"
          echo "=== Checksum ==="
          cd image-cache && sha256sum -c "${{ matrix.base_image }}.sha256"

      - name: Mount and spot-check injected files
        run: |
          sudo modprobe nbd max_part=8
          sleep 1
          sudo qemu-nbd --connect=/dev/nbd0 "image-cache/${{ matrix.base_image }}"
          sleep 2
          sudo partprobe /dev/nbd0
          sleep 1

          echo "=== Partition layout ==="
          lsblk /dev/nbd0

          sudo mkdir -p mnt/android mnt/system
          sudo mount /dev/nbd0p1 mnt/android

          # Files are staged in android/ subdir on p1 (mirrors do_install layout)
          ANDROID_DIR="mnt/android/android"
          sudo test -d "$ANDROID_DIR" \
            || { echo "::error::android/ subdir not found on data partition (p1)"; exit 1; }
          echo "=== android/ subdir contents ==="
          sudo ls -lh "$ANDROID_DIR/"

          # system.sfs is kept intact (squashfs, read-only); system.img as fallback
          SYS=""
          if sudo test -f "${ANDROID_DIR}/system.sfs"; then
            echo "system.sfs present (squashfs — system prop checks skipped)"
          elif sudo test -f "${ANDROID_DIR}/system.img"; then
            sudo mount -o loop,ro "${ANDROID_DIR}/system.img" mnt/system
            if sudo test -f "mnt/system/build.prop" || sudo test -d "mnt/system/app"; then
              SYS="mnt/system"
            elif sudo test -f "mnt/system/system/build.prop"; then
              SYS="mnt/system/system"
            else
              SYS="mnt/system"
            fi
          else
            echo "::error::No system.sfs or system.img found in android/ on p1"; exit 1
          fi

          HAS_VENDOR_IMG=false
          if sudo test -f "${ANDROID_DIR}/vendor.img"; then
            sudo mkdir -p mnt/vendor
            sudo mount -o loop,ro "${ANDROID_DIR}/vendor.img" mnt/vendor
            HAS_VENDOR_IMG=true
            VENDOR_CHECK="mnt/vendor"
          elif [ -n "$SYS" ]; then
            VENDOR_CHECK="${SYS}/vendor"
          else
            VENDOR_CHECK=""
          fi

          FAIL=0
          check_file() {
            if sudo test -e "$1"; then
              echo "  ✓ $1"
            else
              echo "  ✗ MISSING: $1"
              FAIL=$((FAIL+1))
            fi
          }

          # GApps check — only for distros with inject_gapps=true
          if [ "${{ matrix.inject_gapps }}" = "true" ]; then
            echo "=== GApps presence ==="
            gmscore_found=false
            for gms_dir in com.google.android.gms PrebuiltGmsCore GmsCore; do
              if sudo test -d "${SYS}/priv-app/${gms_dir}"; then
                echo "  ✓ GmsCore found at priv-app/${gms_dir}"
                gmscore_found=true
                break
              fi
            done
            $gmscore_found || { echo "  ✗ MISSING: GmsCore"; FAIL=$((FAIL+1)); }
            if sudo test -f "${SYS}/etc/permissions/privapp-permissions-google.xml"; then
              echo "  ✓ privapp-permissions-google.xml"
            else
              echo "  ⚠ privapp-permissions-google.xml absent (may be granted via ROM config)"
            fi
          else
            echo "=== GApps: FOSS build (${{ matrix.distro }}) — skipping GmsCore check ==="
          fi

          if [ "${{ matrix.inject_arm_trans }}" = "true" ]; then
            echo "=== ARM translation presence ==="
            if [ -n "$VENDOR_CHECK" ]; then
              check_file "${VENDOR_CHECK}/lib64/ndk_translation/libndk_translation.so"
              check_file "${VENDOR_CHECK}/etc/binfmt_misc"

              echo "=== ARM bridge props ==="
              VPROP="${VENDOR_CHECK}/build.prop"
              if sudo test -f "$VPROP" && sudo grep -q "ro.dalvik.vm.native.bridge=libndk_translation.so" "$VPROP"; then
                echo "  ✓ ro.dalvik.vm.native.bridge present"
              else
                echo "  ✗ ro.dalvik.vm.native.bridge missing from ${VPROP}"
                FAIL=$((FAIL+1))
              fi
            else
              echo "  ✗ No vendor mount available for ARM translation check"
              FAIL=$((FAIL+1))
            fi
          else
            echo "=== ARM translation: disabled for ${{ matrix.distro }} — skipping checks ==="
          fi

          echo "=== Boot sidecars ==="
          BASE_IMAGE="${{ matrix.base_image }}"
          BASE_NAME="${BASE_IMAGE%.qcow2}"
          for sidecar in "image-cache/${BASE_NAME}-kernel" \
                         "image-cache/${BASE_NAME}-initrd.img" \
                         "image-cache/${BASE_NAME}-cmdline"; do
            if [ -f "$sidecar" ]; then
              echo "  ✓ $(basename "$sidecar")"
            else
              echo "  ✗ MISSING: $(basename "$sidecar")"
              FAIL=$((FAIL+1))
            fi
          done
          echo "  cmdline: $(cat "image-cache/${BASE_NAME}-cmdline" 2>/dev/null || echo '(missing)')"

          $HAS_VENDOR_IMG && sudo umount mnt/vendor 2>/dev/null || true
          sudo umount mnt/system mnt/android 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          sudo rmdir mnt/vendor mnt/system mnt/android 2>/dev/null || true

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::${FAIL} static check(s) failed for ${{ matrix.distro }}"
            exit 1
          fi
          echo "All static checks passed for ${{ matrix.distro }}"

  # ─── Job 4: full VM boot smoke test (optional, KVM only, bliss14) ─────────
  #
  # Only runs when explicitly requested via workflow_dispatch with
  # run_smoke_test=true AND a self-hosted KVM runner is available.
  # Targets bliss14 — the tested and known-booting distro.
  smoke-test:
    name: Smoke test (KVM boot — bliss14)
    needs: [preflight, build]
    if: inputs.run_smoke_test == true && needs.build.result == 'success'
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm KVM is available
        run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm not found on this runner"; exit 1; }
          echo "KVM confirmed: $(ls -la /dev/kvm)"

      - name: Install ADB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends android-tools-adb qemu-utils

      - name: Get bliss14 cache key from matrix
        id: bliss14
        run: |
          key=$(echo '${{ needs.preflight.outputs.matrix }}' \
            | jq -r '.include[] | select(.distro=="bliss14") | .cache_key')
          base=$(echo '${{ needs.preflight.outputs.matrix }}' \
            | jq -r '.include[] | select(.distro=="bliss14") | .base_image')
          [ -n "$key" ]  || { echo "::error::bliss14 not in this build's matrix"; exit 1; }
          echo "cache_key=${key}"   >> $GITHUB_OUTPUT
          echo "base_image=${base}" >> $GITHUB_OUTPUT

      - name: Restore bliss14 image from cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ steps.bliss14.outputs.cache_key }}

      - name: Boot VM headlessly
        run: |
          BASE_IMAGE="${{ steps.bliss14.outputs.base_image }}"
          BASE_NAME="${BASE_IMAGE%.qcow2}"
          KERNEL="image-cache/${BASE_NAME}-kernel"
          INITRD="image-cache/${BASE_NAME}-initrd.img"
          CMDLINE_FILE="image-cache/${BASE_NAME}-cmdline"
          [ -f "$KERNEL" ]       || { echo "::error::Kernel sidecar not found: $KERNEL"; exit 1; }
          [ -f "$INITRD" ]       || { echo "::error::Initrd sidecar not found: $INITRD"; exit 1; }
          [ -f "$CMDLINE_FILE" ] || { echo "::error::Cmdline sidecar not found: $CMDLINE_FILE"; exit 1; }
          ISO_PARAMS=$(cat "$CMDLINE_FILE")
          APPEND="root=/dev/ram0 ${ISO_PARAMS} DATA=/dev/sda2 console=ttyS0,115200n8 androidboot.enable_console=1 quiet"
          qemu-system-x86_64 \
            -enable-kvm \
            -smp 2 -m 2048 \
            -cpu host \
            -machine pc-q35-10.0,vmport=off \
            -kernel "$KERNEL" \
            -initrd "$INITRD" \
            -append "$APPEND" \
            -device virtio-scsi-pci,id=scsi0 \
            -drive "file=image-cache/${{ steps.bliss14.outputs.base_image }},if=none,id=hd0" \
            -device "scsi-hd,drive=hd0,bus=scsi0.0" \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp::5555-:5555 \
            -device ich9-usb-ehci1 \
            -device ich9-usb-uhci1 \
            -device ich9-usb-uhci2 \
            -device ich9-usb-uhci3 \
            -device usb-tablet \
            -display none -vga std \
            -daemonize \
            -pidfile /tmp/qemu.pid
          echo "VM started, waiting 30s for ADB..."
          sleep 30

      - name: ADB smoke checks
        run: |
          adb connect localhost:5555
          adb wait-for-device shell echo "ADB OK"
          adb shell getprop ro.dalvik.vm.native.bridge
          ! adb shell getprop | grep -qi "generic_x86\|test-keys\|emulator"

      - name: Kill VM
        if: always()
        run: |
          kill $(cat /tmp/qemu.pid) 2>/dev/null || true
          rm -f userdata-test.qcow2
