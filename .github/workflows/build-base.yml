name: Build Android 11 Base Image

on:
  push:
    branches: [main]
    paths:
      - 'gapps/**'
      - 'arm-trans/**'
      - 'scripts/lib/inject-gapps.sh'
      - 'scripts/lib/inject-arm-trans.sh'
      - 'scripts/build-intermediate.sh'
      - '.github/workflows/build-base.yml'
  schedule:
    # Rebuild monthly to pick up updated GApps packages
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild even if cache is valid'
        type: boolean
        default: false
      source_img_url:
        description: 'Override Bliss OS ISO URL (leave blank to auto-resolve latest from SourceForge)'
        type: string
        default: ''
      gapps_url:
        description: 'Override GApps download URL (leave blank for default)'
        type: string
        default: ''
      run_smoke_test:
        description: 'Run full VM boot smoke test (requires self-hosted KVM runner)'
        type: boolean
        default: false

# Only one build runs at a time — later runs cancel earlier queued ones
concurrency:
  group: build-base
  cancel-in-progress: true

env:
  BLISSOS_SF_PATH: "Official/BlissOS14/FOSS/Generic"
  SOURCE_IMG_SHA256: ""   # set to a sha256 hex string to pin and verify a specific release
  # OpenGApps pico x86_64 for Android 11 — last build before the project froze
  GAPPS_URL_DEFAULT: "https://sourceforge.net/projects/opengapps/files/x86_64/20220503/open_gapps-x86_64-11.0-pico-20220503.zip/download"
  GAPPS_SHA256: ""
  ARM_TRANS_COMMIT: "9324a8914b649b885dad6f2bfd14a67e5d1520bf"
  OUTPUT_IMAGE: "blissos14-gapps-arm.qcow2"

jobs:
  # ─── Job 1: validate inputs, compute cache key ───────────────────────────
  preflight:
    name: Preflight checks
    runs-on: ubuntu-22.04
    outputs:
      cache_key:          ${{ steps.key.outputs.cache_key }}
      gapps_url:          ${{ steps.urls.outputs.gapps_url }}
      source_img_url:     ${{ steps.source.outputs.source_img_url }}
      source_img_filename: ${{ steps.source.outputs.source_img_filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Bliss OS ISO URL
        id: source
        run: |
          if [ -n "${{ inputs.source_img_url }}" ]; then
            # Manual override supplied via workflow_dispatch
            url="${{ inputs.source_img_url }}"
            # Derive filename from URL (last path component before /download)
            filename=$(basename "$(dirname "$url")")
            echo "source_img_url=${url}" >> $GITHUB_OUTPUT
            echo "source_img_filename=${filename}" >> $GITHUB_OUTPUT
            echo "Using manually provided URL: ${url}"
          else
            # Dynamically resolve the latest ISO from SourceForge
            output=$(python3 scripts/lib/resolve-blissos-url.py \
              --path "${{ env.BLISSOS_SF_PATH }}" \
              --filter ".iso")
            url=$(echo "$output" | grep '^url=' | cut -d= -f2-)
            filename=$(echo "$output" | grep '^filename=' | cut -d= -f2-)
            [ -n "$url" ] || { echo "::error::resolve-blissos-url.py returned no URL"; exit 1; }
            echo "source_img_url=${url}" >> $GITHUB_OUTPUT
            echo "source_img_filename=${filename}" >> $GITHUB_OUTPUT
            echo "Resolved latest Bliss OS ISO: ${filename}"
            echo "Download URL: ${url}"
          fi

      - name: Resolve GApps URL
        id: urls
        run: |
          if [ -n "${{ inputs.gapps_url }}" ]; then
            echo "gapps_url=${{ inputs.gapps_url }}" >> $GITHUB_OUTPUT
          else
            echo "gapps_url=${{ env.GAPPS_URL_DEFAULT }}" >> $GITHUB_OUTPUT
          fi

      - name: Compute cache key
        id: key
        run: |
          # Cache key is a hash of every input that affects the output image.
          # A cache hit means we can skip the multi-hour build and reuse the
          # previously uploaded artifact.
          hash=$(echo -n \
            "${{ steps.source.outputs.source_img_filename }}" \
            "${{ env.SOURCE_IMG_SHA256 }}" \
            "${{ steps.urls.outputs.gapps_url }}" \
            "${{ env.ARM_TRANS_COMMIT }}" \
            "$(sha256sum scripts/lib/inject-gapps.sh scripts/lib/inject-arm-trans.sh \
               | awk '{print $1}' | tr -d '\n')" \
            | sha256sum | awk '{print $1}' | cut -c1-16)
          echo "cache_key=base-image-${hash}" >> $GITHUB_OUTPUT

      - name: Validate all profile schemas
        run: |
          pip install jsonschema --quiet
          for f in profiles/*.json; do
            [ "$(basename "$f")" = "schema.json" ] && continue
            echo "Validating $f"
            python3 scripts/lib/profile-validator.py "$f"
          done

  # ─── Job 2: check if a valid cached image already exists ─────────────────
  check-cache:
    name: Check image cache
    needs: preflight
    runs-on: ubuntu-22.04
    outputs:
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Check cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ needs.preflight.outputs.cache_key }}
          lookup-only: true

  # ─── Job 3: build the intermediate image ─────────────────────────────────
  #
  # Runs on standard GitHub-hosted ubuntu-22.04 runners. KVM is NOT required
  # here — the image is built via offline NBD mount + file injection, which is
  # pure userspace. If /dev/kvm happens to be present the step logs it, but
  # the build never tries to boot the VM.
  #
  # Note on performance: without KVM, QEMU TCG would be slow — but this job
  # never boots QEMU. qemu-nbd and qemu-img are host tools only. Runtime is
  # dominated by download speeds and rsync, not emulation.
  build:
    name: Build intermediate image
    needs: [preflight, check-cache]
    if: needs.check-cache.outputs.cache_hit != 'true' || inputs.force_rebuild == true
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect execution environment
        id: env_detect
        run: |
          if [ -e /dev/kvm ]; then
            echo "kvm=true" >> $GITHUB_OUTPUT
            echo "KVM available — hardware acceleration present"
          else
            echo "kvm=false" >> $GITHUB_OUTPUT
            echo "::notice::KVM not available on this runner. Build uses offline NBD" \
                 "mount only and does not boot the VM, so this is fine."
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils \
            android-tools-adb simg2img \
            e2fsprogs python3 python3-pip jq curl rsync \
            ovmf p7zip-full lzip unzip squashfs-tools \
            grub-efi-amd64-bin parted
          pip3 install jsonschema --quiet

      # ── Download & verify Bliss OS source ISO ─────────────────────────
      - name: Cache source image download
        uses: actions/cache@v4
        id: source-cache
        with:
          path: source-image/
          key: source-img-${{ needs.preflight.outputs.source_img_filename }}

      - name: Download Bliss OS ISO
        if: steps.source-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p source-image

          if [ -n "${{ inputs.source_img_url }}" ]; then
            ISO_URL="${{ inputs.source_img_url }}"
            ISO_NAME=$(basename "$(dirname "$ISO_URL")")
            echo "Using manually provided URL: ${ISO_URL}"
          else
            # Resolve the latest Bliss OS 14 FOSS ISO from SourceForge
            resolver_out=$(python3 scripts/lib/resolve-blissos-url.py \
              --path "${{ env.BLISSOS_SF_PATH }}" \
              --filter ".iso")
            ISO_URL=$(echo "$resolver_out" | grep '^url='      | cut -d= -f2-)
            ISO_NAME=$(echo "$resolver_out" | grep '^filename=' | cut -d= -f2-)
            [ -n "$ISO_URL" ] \
              || { echo "::error::resolve-blissos-url.py returned no URL"; exit 1; }
            echo "Resolved latest Bliss OS ISO: ${ISO_NAME}"
            echo "Download URL: ${ISO_URL}"
          fi

          curl -L --retry 5 --retry-delay 10 \
            "${ISO_URL}" \
            -o source-image/source.img

          if [ -n "${{ env.SOURCE_IMG_SHA256 }}" ]; then
            echo "${{ env.SOURCE_IMG_SHA256 }}  source-image/source.img" | sha256sum -c
          else
            echo "::warning::No SHA256 pinned for source image — skipping checksum"
          fi

          # Verify the download is actually an ISO, not an HTML redirect page
          file source-image/source.img
          file source-image/source.img | grep -qi "ISO 9660\|CD-ROM" \
            || { echo "::error::Downloaded file is not an ISO — SourceForge may have served an HTML page. URL: ${ISO_URL}"; exit 1; }

      # ── Download & verify GApps ─────────────────────────────────────────
      - name: Cache GApps download
        uses: actions/cache@v4
        id: gapps-cache
        with:
          path: gapps/
          key: gapps-${{ needs.preflight.outputs.gapps_url }}

      - name: Download GApps
        if: steps.gapps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p gapps
          curl -L --retry 5 --retry-delay 10 \
            "${{ needs.preflight.outputs.gapps_url }}" \
            -o gapps/gapps.zip
          if [ -n "${{ env.GAPPS_SHA256 }}" ]; then
            echo "${{ env.GAPPS_SHA256 }}  gapps/gapps.zip" | sha256sum -c
          fi
          file gapps/gapps.zip
          file gapps/gapps.zip | grep -qi "Zip archive\|zip\|Java archive" \
            || { echo "::error::Downloaded GApps file is not a zip — URL may have returned an HTML page"; exit 1; }

      # ── Download ARM translation libs ───────────────────────────────────
      - name: Cache ARM translation
        uses: actions/cache@v4
        id: armtrans-cache
        with:
          path: arm-trans/
          key: arm-trans-${{ env.ARM_TRANS_COMMIT }}

      - name: Download ARM translation
        if: steps.armtrans-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/lib/fetch-arm-trans.sh arm-trans/

      # ── Extract partition images from ISO ──────────────────────────────────
      # Bliss OS ISOs use SquashFS: partition images live inside system.sfs
      # (and optionally vendor.sfs / product.sfs) rather than as bare .img
      # files. Pipeline:
      #   1. Loop-mount the ISO
      #   2. unsquashfs each .sfs → extracts system.img (etc.) from within
      #   3. Fall back to bare .img files if no .sfs present
      - name: Extract partition images from ISO
        run: |
          mkdir -p iso-mount work
          sudo mount -o loop,ro source-image/source.img iso-mount

          echo "=== ISO root contents ==="
          ls -la iso-mount/

          FOUND=0

          for name in system vendor product; do
            sfs="iso-mount/${name}.sfs"
            img_direct="iso-mount/${name}.img"
            img_subdir="iso-mount/${name}/${name}.img"

            if [ -f "$sfs" ]; then
              size=$(du -sh "$sfs" | cut -f1)
              echo "Unsquashing ${name}.sfs (${size}) ..."
              sudo unsquashfs -d "work/sfs-${name}" "$sfs"
              # The .img may be at the squashfs root or one level in
              for inner in "work/sfs-${name}/${name}.img" \
                           "work/sfs-${name}/system.img" \
                           "work/sfs-${name}/${name}/${name}.img"; do
                if [ -f "$inner" ]; then
                  mv "$inner" "work/${name}.img"
                  FOUND=$((FOUND+1))
                  break
                fi
              done
              sudo rm -rf "work/sfs-${name}"

            elif [ -f "$img_direct" ]; then
              size=$(du -sh "$img_direct" | cut -f1)
              echo "Copying ${name}.img (${size}) ..."
              cp "$img_direct" "work/${name}.img"
              FOUND=$((FOUND+1))

            elif [ -f "$img_subdir" ]; then
              size=$(du -sh "$img_subdir" | cut -f1)
              echo "Copying ${name}/${name}.img (${size}) ..."
              cp "$img_subdir" "work/${name}.img"
              FOUND=$((FOUND+1))
            fi
          done

          # Save boot files needed for final disk assembly
          for item in kernel initrd.img ramdisk.img isolinux grub efi; do
            [ -e "iso-mount/${item}" ] && cp -r "iso-mount/${item}" "work/boot-${item}" || true
          done

          sudo umount iso-mount
          rmdir iso-mount

          [ "$FOUND" -gt 0 ] || { echo "::error::No partition images (.sfs or .img) found in ISO"; exit 1; }
          echo "Extracted ${FOUND} partition image(s)"
          ls -lh work/

      - name: Convert Android sparse images to raw ext4
        run: |
          for name in system vendor product; do
            src="work/${name}.img"
            [ -f "$src" ] || continue
            dst="work/${name}.raw"
            echo "Converting ${name}.img ..."
            simg2img "$src" "$dst" 2>/dev/null \
              && echo "  sparse → raw" \
              || { cp "$src" "$dst"; echo "  as-is (not sparse)"; }
            rm -f "$src"
            file "$dst"
          done

      - name: Resize system image to accommodate GApps
        run: |
          # GApps adds ~400-500 MB; add 600 MB headroom before injection.
          # truncate -s +600M grows the backing file; resize2fs with no size
          # argument then expands the filesystem to fill the extra space.
          e2fsck -yf work/system.raw || true
          truncate -s +600M work/system.raw
          resize2fs work/system.raw
          e2fsck -yf work/system.raw || true

      # ── Loop-mount raw images and inject ───────────────────────────────────
      - name: Mount partition images
        run: |
          sudo mkdir -p mnt/system mnt/product
          sudo mount -o loop,rw work/system.raw mnt/system
          [ -f work/product.raw ] && sudo mount -o loop,rw work/product.raw mnt/product \
            || echo "No product partition — product injection skipped"
          # Bliss OS has no separate vendor.img; vendor lives at system/vendor/
          if [ -f work/vendor.raw ]; then
            sudo mkdir -p mnt/vendor
            sudo mount -o loop,rw work/vendor.raw mnt/vendor
            echo "VENDOR_MNT=mnt/vendor" >> "$GITHUB_ENV"
          else
            # vendor is inside system.raw. /vendor in the Android rootfs is often a
            # symlink (e.g. -> /system/vendor). Resolve it so we write to the real path.
            VPATH="mnt/system/vendor"
            if sudo test -L "$VPATH"; then
              link_target=$(sudo readlink "$VPATH")
              if [[ "$link_target" = /* ]]; then
                # Absolute symlink — rebase onto our mount point
                VPATH="mnt/system${link_target}"
              else
                VPATH="mnt/system/$(dirname vendor)/${link_target}"
              fi
              echo "Resolved /vendor symlink -> ${link_target}, using ${VPATH}"
            fi
            sudo mkdir -p "$VPATH"
            echo "VENDOR_MNT=${VPATH}" >> "$GITHUB_ENV"
            echo "No separate vendor.img — using ${VPATH}"
          fi

      - name: Inject GApps
        run: |
          sudo bash scripts/lib/inject-gapps.sh \
            gapps/gapps.zip \
            mnt/system \
            mnt/product

      - name: Inject ARM translation
        run: |
          sudo bash scripts/lib/inject-arm-trans.sh \
            arm-trans/ \
            "${{ env.VENDOR_MNT }}"

      - name: Write ARM bridge props
        run: |
          VPROP="${{ env.VENDOR_MNT }}/build.prop"
          sudo touch "$VPROP"
          for kv in \
            "ro.product.cpu.abilist=x86_64,x86,arm64-v8a,armeabi-v7a,armeabi" \
            "ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi" \
            "ro.product.cpu.abilist64=x86_64,arm64-v8a" \
            "ro.dalvik.vm.native.bridge=libndk_translation.so" \
            "ro.enable.native.bridge.exec=1" \
            "ro.vendor.enable.native.bridge.exec=1" \
            "ro.vendor.enable.native.bridge.exec64=1" \
            "ro.ndk_translation.version=0.2.2"
          do
            key="${kv%%=*}"
            if sudo grep -q "^${key}=" "$VPROP" 2>/dev/null; then
              sudo sed -i "s|^${key}=.*|${kv}|" "$VPROP"
            else
              echo "$kv" | sudo tee -a "$VPROP" > /dev/null
            fi
          done
          echo "=== ARM bridge props ==="
          grep "ro\.dalvik\|ro\.enable\.native\|ro\.vendor\.enable\|ro\.ndk_translation\|abilist" "$VPROP"

      - name: Restore SELinux file contexts
        run: |
          if command -v restorecon &>/dev/null; then
            sudo restorecon -R -F mnt/system/priv-app/ 2>/dev/null || true
            sudo restorecon -R -F "${{ env.VENDOR_MNT }}/lib64/ndk_translation/" 2>/dev/null || true
          else
            echo "::notice::restorecon not available — Android init handles context labelling on first boot"
          fi

      - name: Unmount partition images
        if: always()
        run: |
          # Unmount separate vendor/product if they were mounted as loop devices
          if [ -f work/vendor.raw ]; then
            sudo umount mnt/vendor 2>/dev/null || true
            sudo rmdir mnt/vendor 2>/dev/null || true
          fi
          sudo umount mnt/product 2>/dev/null || true
          sudo umount mnt/system 2>/dev/null || true
          sudo rmdir mnt/product mnt/system 2>/dev/null || true

      # ── Assemble bootable disk image ────────────────────────────────────────
      # Creates a GPT disk with an EFI partition (GRUB) and an ext4 Android data
      # partition containing the modified system.img, kernel, and ramdisk.
      # Android x86 boots by having GRUB loop-mount system.img from the data partition.
      - name: Assemble bootable disk image
        run: |
          SYSTEM_SZ=$(stat -c%s work/system.raw)
          VENDOR_SZ=$([ -f work/vendor.raw  ] && stat -c%s work/vendor.raw  || echo 0)
          PRODUCT_SZ=$([ -f work/product.raw ] && stat -c%s work/product.raw || echo 0)
          BOOT_SZ=$(find work/ -maxdepth 1 -name 'boot-*' -exec du -sb {} + 2>/dev/null \
                    | awk '{s+=$1}END{print s+0}')

          # EFI partition: 256 MB; data partition: content + 20% + 256 MB buffer
          DATA_CONTENT=$(( SYSTEM_SZ + VENDOR_SZ + PRODUCT_SZ + BOOT_SZ ))
          DATA_SZ=$(( DATA_CONTENT * 12 / 10 + 256 * 1024 * 1024 ))
          DISK_SZ=$(( DATA_SZ + 256 * 1024 * 1024 + 4 * 1024 * 1024 ))
          echo "Disk size: $(( DISK_SZ / 1024 / 1024 )) MB  (data $(( DATA_SZ / 1024 / 1024 )) MB)"

          truncate -s $DISK_SZ work/disk.raw

          sudo parted -s work/disk.raw \
            mklabel gpt \
            mkpart EFI  fat32 1MiB   257MiB \
            set 1 esp on \
            mkpart Data ext4  257MiB 100%

          LOOP=$(sudo losetup --find --show --partscan work/disk.raw)
          echo "Loop device: $LOOP"
          sleep 1

          sudo mkfs.fat -F32 -n EFI    "${LOOP}p1"
          sudo mkfs.ext4 -L Android    "${LOOP}p2"

          sudo mkdir -p mnt/efi mnt/android
          sudo mount "${LOOP}p1" mnt/efi
          sudo mount "${LOOP}p2" mnt/android

          # Copy Android system files to data partition
          sudo cp work/system.raw  mnt/android/system.img
          [ -f work/vendor.raw  ] && sudo cp work/vendor.raw  mnt/android/vendor.img  || true
          [ -f work/product.raw ] && sudo cp work/product.raw mnt/android/product.img || true
          [ -f work/boot-kernel ]        && sudo cp work/boot-kernel        mnt/android/kernel       || true
          [ -f work/boot-ramdisk.img ]   && sudo cp work/boot-ramdisk.img   mnt/android/ramdisk.img  || true
          [ -f work/boot-initrd.img ]    && sudo cp work/boot-initrd.img    mnt/android/initrd.img   || true

          # Install GRUB EFI
          sudo grub-install \
            --target=x86_64-efi \
            --efi-directory=mnt/efi \
            --boot-directory=mnt/android/boot \
            --removable \
            --no-nvram

          # GRUB config — Android x86 standard kernel cmdline
          sudo mkdir -p mnt/android/boot/grub
          sudo tee mnt/android/boot/grub/grub.cfg > /dev/null << 'GRUBCFG'
          set default=0
          set timeout=3

          menuentry "Android-x86" {
            search --set=root --label Android
            linux  /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 \
                   androidboot.selinux=enforcing DATA=
            initrd /ramdisk.img
          }
          GRUBCFG

          sudo umount mnt/efi mnt/android
          sudo rmdir  mnt/efi mnt/android
          sudo losetup -d "$LOOP"

      # ── Convert to qcow2 and checksum ───────────────────────────────────────
      - name: Convert disk image to qcow2
        run: |
          mkdir -p image-cache
          qemu-img convert -O qcow2 -c \
            work/disk.raw \
            image-cache/${{ env.OUTPUT_IMAGE }}
          qemu-img info image-cache/${{ env.OUTPUT_IMAGE }}

      - name: Record checksums
        run: |
          cd image-cache
          sha256sum ${{ env.OUTPUT_IMAGE }} > ${{ env.OUTPUT_IMAGE }}.sha256
          cat ${{ env.OUTPUT_IMAGE }}.sha256

      # ── Cache for future runs ───────────────────────────────────────────
      - name: Save image to cache
        uses: actions/cache/save@v4
        with:
          path: image-cache/
          key: ${{ needs.preflight.outputs.cache_key }}

      # ── Upload as GitHub Release artifact ───────────────────────────────
      - name: Create release tag
        id: tag
        run: echo "tag=base-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Base image ${{ steps.tag.outputs.tag }}"
          body: |
            Intermediate base image with GApps + ARM translation pre-baked.

            - ARM translation: libndk_translation (commit ${{ env.ARM_TRANS_COMMIT }})
            - GApps: OpenGApps pico x86_64 11.0

            Verify before use:
            ```
            sha256sum -c ${{ env.OUTPUT_IMAGE }}.sha256
            ```
          files: |
            image-cache/${{ env.OUTPUT_IMAGE }}
            image-cache/${{ env.OUTPUT_IMAGE }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 4: restore cache hit (no build needed) ───────────────────────
  restore-from-cache:
    name: Restore cached image
    needs: [preflight, check-cache]
    if: needs.check-cache.outputs.cache_hit == 'true' && inputs.force_rebuild != true
    runs-on: ubuntu-22.04
    steps:
      - name: Restore from cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ needs.preflight.outputs.cache_key }}
      - name: Confirm
        run: |
          echo "Cache hit — skipping build"
          ls -lh image-cache/

      - name: Create release tag
        id: tag
        run: echo "tag=base-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Upload cached image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Base image ${{ steps.tag.outputs.tag }} (cached)"
          body: |
            Cache hit — image content unchanged from previous build.

            - ARM translation: libndk_translation (commit ${{ env.ARM_TRANS_COMMIT }})
            - GApps: OpenGApps pico x86_64 11.0

            Verify before use:
            ```
            sha256sum -c ${{ env.OUTPUT_IMAGE }}.sha256
            ```
          files: |
            image-cache/${{ env.OUTPUT_IMAGE }}
            image-cache/${{ env.OUTPUT_IMAGE }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 5: static artifact validation (no KVM needed) ───────────────
  #
  # Runs on GitHub-hosted runners. Mounts the built image via NBD and spot-
  # checks that key files were injected correctly. Catches injection failures
  # without requiring a live VM boot.
  validate-artifact:
    name: Validate artifact (static)
    needs: [preflight, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils python3 jq
          pip3 install jsonschema --quiet

      - name: Restore built image from cache
        uses: actions/cache/restore@v4
        with:
          path: image-cache/
          key: ${{ needs.preflight.outputs.cache_key }}

      - name: Verify image integrity
        run: |
          echo "=== qemu-img check ==="
          qemu-img check image-cache/${{ env.OUTPUT_IMAGE }}
          echo "=== Image info ==="
          qemu-img info image-cache/${{ env.OUTPUT_IMAGE }}
          echo "=== Checksum ==="
          cd image-cache && sha256sum -c ${{ env.OUTPUT_IMAGE }}.sha256

      - name: Mount and spot-check injected files
        run: |
          # Disk layout: GPT p1=EFI (FAT32), p2=Android data (ext4).
          # system.img lives on p2 and is loop-mounted. vendor.img may not
          # exist (Bliss OS embeds vendor inside system.img at /vendor).
          sudo modprobe nbd max_part=8
          sleep 1
          sudo qemu-nbd --connect=/dev/nbd0 image-cache/${{ env.OUTPUT_IMAGE }}
          sleep 2
          sudo partprobe /dev/nbd0
          sleep 1

          echo "=== Partition layout ==="
          lsblk /dev/nbd0

          sudo mkdir -p mnt/android mnt/system
          sudo mount /dev/nbd0p2 mnt/android

          [ -f mnt/android/system.img ] \
            && sudo mount -o loop,ro mnt/android/system.img mnt/system \
            || { echo "::error::system.img not found on data partition"; exit 1; }

          # vendor is either a separate image or a directory inside system
          HAS_VENDOR_IMG=false
          if [ -f mnt/android/vendor.img ]; then
            sudo mkdir -p mnt/vendor
            sudo mount -o loop,ro mnt/android/vendor.img mnt/vendor
            HAS_VENDOR_IMG=true
            VENDOR_CHECK_ROOT="mnt/vendor"
          else
            echo "No separate vendor.img — checking mnt/system/vendor"
            VENDOR_CHECK_ROOT="mnt/system/vendor"
          fi

          FAIL=0
          check_file() {
            if [ -e "$1" ]; then
              echo "  ✓ $1"
            else
              echo "  ✗ MISSING: $1"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== GApps presence ==="
          check_file mnt/system/priv-app/GmsCore
          check_file mnt/system/etc/permissions/privapp-permissions-google.xml

          echo "=== ARM translation presence ==="
          check_file "${VENDOR_CHECK_ROOT}/lib64/ndk_translation/libndk_translation.so"
          check_file "${VENDOR_CHECK_ROOT}/etc/binfmt_misc"

          echo "=== ARM bridge props ==="
          VPROP="${VENDOR_CHECK_ROOT}/build.prop"
          if [ -f "$VPROP" ] && grep -q "ro.dalvik.vm.native.bridge=libndk_translation.so" "$VPROP"; then
            echo "  ✓ ro.dalvik.vm.native.bridge present"
          else
            echo "  ✗ ro.dalvik.vm.native.bridge missing from ${VPROP}"
            FAIL=$((FAIL+1))
          fi

          $HAS_VENDOR_IMG && sudo umount mnt/vendor 2>/dev/null || true
          sudo umount mnt/system mnt/android 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          sudo rmdir mnt/vendor mnt/system mnt/android 2>/dev/null || true

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL static check(s) failed"
            exit 1
          fi
          echo "All static checks passed"

  # ─── Job 6: full VM boot smoke test (optional, KVM only) ─────────────
  #
  # Only runs when explicitly requested via workflow_dispatch with
  # run_smoke_test=true AND a self-hosted KVM runner is available.
  # Never runs on push/schedule — it is not part of the default CI path.
  #
  # Software emulation (TCG) would take hours to boot Android and is not
  # a viable fallback here. If no KVM runner is available, skip this job.
  smoke-test:
    name: Smoke test (KVM boot)
    needs: [preflight, build]
    if: inputs.run_smoke_test == true && needs.build.result == 'success'
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Confirm KVM is available
        run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm not found on this runner"; exit 1; }
          echo "KVM confirmed: $(ls -la /dev/kvm)"

      - name: Install ADB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends android-tools-adb qemu-utils

      - name: Download built image from release
        run: |
          gh release download "${{ needs.build.outputs.release_tag }}" \
            --pattern "${{ env.OUTPUT_IMAGE }}" \
            --dir image-cache/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create throw-away userdata volume
        run: qemu-img create -f qcow2 userdata-test.qcow2 4G

      - name: Boot VM headlessly
        run: |
          qemu-system-x86_64 \
            -enable-kvm \
            -smp 2 -m 2048 \
            -cpu host \
            -machine q35 \
            -drive file=image-cache/${{ env.OUTPUT_IMAGE }},if=virtio,index=0 \
            -drive file=userdata-test.qcow2,if=virtio,index=1 \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp::5555-:5555 \
            -display none \
            -daemonize \
            -pidfile /tmp/qemu.pid
          echo "VM started, waiting 30s for ADB..."
          sleep 30

      - name: ADB smoke checks
        run: |
          adb connect localhost:5555
          adb wait-for-device shell echo "ADB OK"
          adb shell getprop ro.dalvik.vm.native.bridge
          ! adb shell getprop | grep -qi "generic_x86\|test-keys\|emulator"

      - name: Kill VM
        if: always()
        run: |
          kill $(cat /tmp/qemu.pid) 2>/dev/null || true
          rm -f userdata-test.qcow2
